<section class="lobby-world">
  <header class="hero">
    <p class="eyebrow">{{ 'home.eyebrow' | t }}</p>
    <h1>Among Bugs</h1>
    <p class="lead">{{ 'home.lead' | t }}</p>
    <div class="hero-actions">
      <a routerLink="/rooms/create" class="btn-glow">{{ 'home.create' | t }}</a>
      <button type="button" class="btn-ghost" (click)="refresh()">{{ 'home.refresh' | t }}</button>
    </div>
  </header>

  <div class="room-grid" *ngIf="!loading; else loadingTpl">
    <button
      type="button"
      class="room-card"
      *ngFor="let room of rooms"
      (click)="join(room.code)"
      [disabled]="joiningCode === room.code">
      <div class="room-code">{{ room.code }}</div>
      <h2>{{ room.triviaTitle }}</h2>
      <p>{{ 'home.host' | t }} · {{ room.hostUsername }}</p>
      <div class="meta">
        <span>{{ room.playerCount }} / {{ room.maxPlayers }}</span>
        <span>{{ 'home.goal' | t: room.targetScore }}</span>
      </div>
      <span class="join-label">{{ joiningCode === room.code ? ('home.joining' | t) : ('home.join' | t) }}</span>
    </button>

    <div class="empty" *ngIf="rooms.length === 0">
      <div class="pulse-orb"></div>
      <h3>{{ 'home.emptyTitle' | t }}</h3>
      <p>{{ 'home.emptyText' | t }}</p>
      <a routerLink="/rooms/create" class="btn-glow">{{ 'home.create' | t }}</a>
    </div>
  </div>

  <ng-template #loadingTpl>
    <div class="loading-block">
      <div class="spinner"></div>
      <p>{{ 'home.scanning' | t }}</p>
    </div>
  </ng-template>
</section>
