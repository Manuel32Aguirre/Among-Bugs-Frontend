<section class="lobby-world">
  <header class="hero">
    <p class="eyebrow">Lobby en vivo</p>
    <h1>Among Bugs</h1>
    <p class="lead">Elige una sala y únete. El anfitrión prepara las preguntas; tú sobrevives… o saboteas.</p>
    <div class="hero-actions">
      <a routerLink="/rooms/create" class="btn-glow">Crear sala</a>
      <button type="button" class="btn-ghost" (click)="refresh()">Actualizar</button>
    </div>
  </header>

  <div class="room-grid" *ngIf="!loading; else loadingTpl">
    <button
      type="button"
      class="room-card"
      *ngFor="let room of rooms"
      (click)="join(room.code)"
      [disabled]="joiningCode === room.code">
      <div class="room-code">{{ room.code }}</div>
      <h2>{{ room.triviaTitle }}</h2>
      <p>Anfitrión · {{ room.hostUsername }}</p>
      <div class="meta">
        <span>{{ room.playerCount }} / {{ room.maxPlayers }}</span>
        <span>Meta {{ room.targetScore }} pts</span>
      </div>
      <span class="join-label">{{ joiningCode === room.code ? 'Entrando…' : 'Unirse' }}</span>
    </button>

    <div class="empty" *ngIf="rooms.length === 0">
      <div class="pulse-orb"></div>
      <h3>No hay salas abiertas</h3>
      <p>Sé el primero en crear una misión.</p>
      <a routerLink="/rooms/create" class="btn-glow">Crear sala</a>
    </div>
  </div>

  <ng-template #loadingTpl>
    <div class="loading-block">
      <div class="spinner"></div>
      <p>Escaneando salas…</p>
    </div>
  </ng-template>
</section>
