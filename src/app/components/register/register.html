<div class="auth-world">
  <div class="auth-card">
    <div class="logo-glow">AB</div>
    <h2>Among Bugs</h2>
    <p class="subtitle">Únete a la tripulación</p>

    <form (ngSubmit)="onRegister()">
      <div class="form-group">
        <label>NOMBRE DE USUARIO</label>
        <input type="text" name="username" [(ngModel)]="registerData.username" required>
      </div>

      <div class="form-group">
        <label>CORREO ELECTRÓNICO</label>
        <input type="email" name="email" [(ngModel)]="registerData.email" required>
      </div>

      <div class="form-group">
        <label>CONTRASEÑA</label>
        <div class="password-wrap">
          <input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="registerData.password" required>
          <button type="button" class="toggle-pass" (click)="showPassword = !showPassword" [attr.aria-label]="showPassword ? 'Ocultar' : 'Mostrar'">
            <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="submit">Crear cuenta</button>
    </form>

    <p class="footer-text">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
    </p>
  </div>
</div>
