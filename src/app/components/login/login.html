<div class="auth-world">
  <div class="lang-float">
    <button type="button" [class.active]="lang.lang() === 'es-MX'" (click)="lang.setLang('es-MX')">ES</button>
    <button type="button" [class.active]="lang.lang() === 'en'" (click)="lang.setLang('en')">EN</button>
  </div>

  <div class="auth-card">
    <div class="logo-glow">AB</div>
    <h2>{{ 'login.title' | t }}</h2>
    <p class="subtitle">{{ 'login.subtitle' | t }}</p>

    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="email">{{ 'login.email' | t }}</label>
        <input id="email" type="email" name="email" [(ngModel)]="loginData.email" required>
      </div>

      <div class="form-group">
        <label for="password">{{ 'login.password' | t }}</label>
        <div class="password-wrap">
          <input id="password" [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="loginData.password" required>
          <button type="button" class="toggle-pass" (click)="showPassword = !showPassword">
            <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="submit">{{ 'login.submit' | t }}</button>
    </form>

    <p class="footer-text">
      {{ 'login.noAccount' | t }} <a routerLink="/register">{{ 'login.register' | t }}</a>
    </p>
  </div>
</div>
