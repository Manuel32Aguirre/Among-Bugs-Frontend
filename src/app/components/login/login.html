<div class="auth-world">
  <div class="auth-card">
    <div class="logo-glow">AB</div>
    <h2>Among Bugs</h2>
    <p class="subtitle">Inicia sesión para jugar</p>

    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="email">CORREO ELECTRÓNICO</label>
        <input id="email" type="email" name="email" [(ngModel)]="loginData.email" required>
      </div>

      <div class="form-group">
        <label for="password">CONTRASEÑA</label>
        <div class="password-wrap">
          <input id="password" [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="loginData.password" required>
          <button type="button" class="toggle-pass" (click)="showPassword = !showPassword">
            <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="submit">Iniciar sesión</button>
    </form>

    <p class="footer-text">
      ¿No tienes cuenta? <a routerLink="/register">Regístrate</a>
    </p>
  </div>
</div>
